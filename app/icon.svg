<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dotted-canopy tree with twisting branches and authentic roots -->
  <!-- Brand: sage #7A9E6A, sage-soft #B5C4A0, gold #8B7340 -->

  <!-- === ROOTS === -->
  <!-- Main tap root -->
  <path d="M32 53 C32 56 31 59 30 63" stroke="#8B7340" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Left roots — curving organically -->
  <path d="M31 52 C28 54 24 56 20 58 C17 59 14 60 12 62" stroke="#8B7340" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M30 53 C27 55 25 58 22 61" stroke="#8B7340" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M31 51 C28 52 25 53 22 55 C20 56 18 56 16 57" stroke="#8B7340" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Left root tendrils -->
  <path d="M20 58 C19 60 17 62 16 63" stroke="#8B7340" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <path d="M22 55 C20 57 19 58 18 60" stroke="#8B7340" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- Right roots — curving organically -->
  <path d="M33 52 C36 54 40 56 44 58 C47 59 50 60 52 62" stroke="#8B7340" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M34 53 C37 55 39 58 42 61" stroke="#8B7340" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M33 51 C36 52 39 53 42 55 C44 56 46 56 48 57" stroke="#8B7340" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Right root tendrils -->
  <path d="M44 58 C45 60 47 62 48 63" stroke="#8B7340" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <path d="M42 55 C44 57 45 58 46 60" stroke="#8B7340" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- === TRUNK === -->
  <path d="M32 52 C31.5 48 32 44 32.5 40 C33 37 32 35 32 33" stroke="#8B7340" stroke-width="3.8" fill="none" stroke-linecap="round"/>

  <!-- === TWISTING BRANCHES === -->
  <!-- Left main branch — S-curve -->
  <path d="M32 36 C28 34 24 35 20 32 C16 29 14 26 12 22" stroke="#8B7340" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <!-- Left upper twist -->
  <path d="M20 32 C18 28 20 24 18 20 C16 16 14 14 12 12" stroke="#8B7340" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Left mid branch -->
  <path d="M24 34 C20 36 16 36 14 38" stroke="#8B7340" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- Left inner twist -->
  <path d="M28 34 C26 30 24 26 22 22 C20 18 22 14 24 10" stroke="#8B7340" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- Right main branch — S-curve -->
  <path d="M32 36 C36 34 40 35 44 32 C48 29 50 26 52 22" stroke="#8B7340" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <!-- Right upper twist -->
  <path d="M44 32 C46 28 44 24 46 20 C48 16 50 14 52 12" stroke="#8B7340" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Right mid branch -->
  <path d="M40 34 C44 36 48 36 50 38" stroke="#8B7340" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- Right inner twist -->
  <path d="M36 34 C38 30 40 26 42 22 C44 18 42 14 40 10" stroke="#8B7340" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- Center upward branches -->
  <path d="M32 33 C30 28 28 22 30 16 C31 12 32 8 32 5" stroke="#8B7340" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M32 33 C34 28 36 24 34 18 C33 14 34 10 36 6" stroke="#8B7340" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M32 33 C28 28 26 24 28 18" stroke="#8B7340" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- === DOT LEAVES — arranged in a round canopy === -->
  <!-- Top crown -->
  <circle cx="32" cy="4" r="2.5" fill="#7A9E6A"/>
  <circle cx="28" cy="6" r="2.3" fill="#7A9E6A"/>
  <circle cx="36" cy="6" r="2.3" fill="#7A9E6A"/>
  <circle cx="32" cy="8" r="2.2" fill="#B5C4A0"/>
  <circle cx="24" cy="9" r="2.4" fill="#7A9E6A"/>
  <circle cx="40" cy="9" r="2.4" fill="#7A9E6A"/>

  <!-- Upper band -->
  <circle cx="20" cy="12" r="2.6" fill="#7A9E6A"/>
  <circle cx="28" cy="12" r="2.5" fill="#7A9E6A"/>
  <circle cx="36" cy="12" r="2.5" fill="#7A9E6A"/>
  <circle cx="44" cy="12" r="2.6" fill="#7A9E6A"/>
  <circle cx="12" cy="12" r="2.2" fill="#B5C4A0"/>
  <circle cx="52" cy="12" r="2.2" fill="#B5C4A0"/>
  <circle cx="16" cy="10" r="2.3" fill="#7A9E6A"/>
  <circle cx="48" cy="10" r="2.3" fill="#7A9E6A"/>

  <!-- Mid-upper band -->
  <circle cx="10" cy="16" r="2.4" fill="#7A9E6A"/>
  <circle cx="18" cy="16" r="2.7" fill="#7A9E6A"/>
  <circle cx="26" cy="16" r="2.6" fill="#7A9E6A"/>
  <circle cx="34" cy="16" r="2.5" fill="#B5C4A0"/>
  <circle cx="42" cy="16" r="2.7" fill="#7A9E6A"/>
  <circle cx="54" cy="16" r="2.4" fill="#7A9E6A"/>
  <circle cx="50" cy="18" r="2.3" fill="#B5C4A0"/>

  <!-- Middle band — widest part of round canopy -->
  <circle cx="8" cy="22" r="2.5" fill="#B5C4A0"/>
  <circle cx="14" cy="20" r="2.7" fill="#7A9E6A"/>
  <circle cx="22" cy="20" r="2.8" fill="#7A9E6A"/>
  <circle cx="30" cy="20" r="2.6" fill="#7A9E6A"/>
  <circle cx="38" cy="20" r="2.6" fill="#7A9E6A"/>
  <circle cx="46" cy="20" r="2.8" fill="#7A9E6A"/>
  <circle cx="56" cy="22" r="2.5" fill="#B5C4A0"/>
  <circle cx="52" cy="22" r="2.7" fill="#7A9E6A"/>
  <circle cx="12" cy="22" r="2.7" fill="#7A9E6A"/>

  <!-- Lower-mid band -->
  <circle cx="10" cy="26" r="2.5" fill="#7A9E6A"/>
  <circle cx="18" cy="26" r="2.7" fill="#7A9E6A"/>
  <circle cx="26" cy="25" r="2.6" fill="#B5C4A0"/>
  <circle cx="34" cy="24" r="2.5" fill="#7A9E6A"/>
  <circle cx="42" cy="25" r="2.7" fill="#7A9E6A"/>
  <circle cx="50" cy="26" r="2.5" fill="#7A9E6A"/>
  <circle cx="54" cy="28" r="2.2" fill="#B5C4A0"/>

  <!-- Lower band — canopy narrows -->
  <circle cx="14" cy="30" r="2.5" fill="#7A9E6A"/>
  <circle cx="22" cy="30" r="2.6" fill="#7A9E6A"/>
  <circle cx="30" cy="29" r="2.4" fill="#7A9E6A"/>
  <circle cx="38" cy="29" r="2.4" fill="#7A9E6A"/>
  <circle cx="46" cy="30" r="2.6" fill="#7A9E6A"/>
  <circle cx="50" cy="32" r="2.3" fill="#B5C4A0"/>

  <!-- Bottom fringe -->
  <circle cx="14" cy="36" r="2.2" fill="#B5C4A0"/>
  <circle cx="20" cy="34" r="2.4" fill="#7A9E6A"/>
  <circle cx="44" cy="34" r="2.4" fill="#7A9E6A"/>
  <circle cx="50" cy="36" r="2.2" fill="#B5C4A0"/>
  <circle cx="14" cy="38" r="2" fill="#7A9E6A"/>
  <circle cx="50" cy="38" r="2" fill="#7A9E6A"/>
</svg>
